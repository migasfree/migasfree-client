name: Windows Tests

on:
  push:
    branches: [master, REST-API]
  pull_request:
    branches: [master, REST-API]

jobs:
  test_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Tests
        # Skip linux-specific tests if markers exist, or handle gracefully
        # Assuming typical pytest usage. If specific markers needed: pytest -m "not linux_only"
        run: |
          pytest --ignore=tests/linux_specific

      - name: Build Wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Upload Wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
