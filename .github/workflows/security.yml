permissions:
  contents: read

name: Security Scan

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install pip-audit

      - name: Run security audit
        run: |
          # CVE-2026-4539: transitive dependency, no exploit path in client
          # CVE-2026-25645: patched in later version, waiting upstream release
          # CVE-2026-26007: disputed, not applicable to our usage
          # CVE-2025-8869: low severity, no impact on client-side operations
          # CVE-2026-1703: affects server-side only, client not in scope
          pip-audit \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-25645 \
            --ignore-vuln CVE-2026-26007 \
            --ignore-vuln CVE-2025-8869 \
            --ignore-vuln CVE-2026-1703
